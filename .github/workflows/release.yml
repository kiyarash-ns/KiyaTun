name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: vet
        run: go vet ./...

      - name: build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o tunx-linux-amd64 .

      - name: build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o tunx-linux-arm64 .

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tunx-linux-amd64
            tunx-linux-arm64
